server
{
    listen 80;
    server_name zhuangxiu.goodsport.fun;
    index index.html index.htm;
    root /www/wwwroot/zhuangxiu;
    access_log /www/wwwlogs/zhuangxiu.goodsport.fun.log;
    error_log /www/wwwlogs/zhuangxiu.goodsport.fun.error.log;
    client_max_body_size 12m;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3188;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /uploads/ {
        alias /www/wwwroot/zhuangxiu-data/uploads/;
        autoindex off;
        add_header X-Content-Type-Options nosniff;
        expires 30d;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server
{
    listen 443 ssl;
    http2 on;
    server_name zhuangxiu.goodsport.fun;
    index index.html index.htm;
    root /www/wwwroot/zhuangxiu;
    access_log /www/wwwlogs/zhuangxiu.goodsport.fun.log;
    error_log /www/wwwlogs/zhuangxiu.goodsport.fun.error.log;
    client_max_body_size 12m;

    ssl_certificate    /www/server/panel/vhost/cert/zhuangxiu.goodsport.fun/fullchain.pem;
    ssl_certificate_key    /www/server/panel/vhost/cert/zhuangxiu.goodsport.fun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000";

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3188;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /uploads/ {
        alias /www/wwwroot/zhuangxiu-data/uploads/;
        autoindex off;
        add_header X-Content-Type-Options nosniff;
        expires 30d;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
